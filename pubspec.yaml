name: suretakip
description: "Dakika bazlı işletme takip ve ücret hesaplama uygulaması."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^6.1.0
  cupertino_icons: ^1.0.8
  drift: ^2.34.2
  flutter_secure_storage: ^10.3.1
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^3.1.0
  go_router: ^16.0.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  path_provider: ^2.1.5
  sqlite3: ^3.5.0
  supabase_flutter: ^2.10.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: 2.15.1
  drift_dev: 2.34.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  flutter_lints: ^6.0.0

hooks:
  user_defines:
    sqlite3:
      # Android/iOS için sqlite3 3.x native-assets SQLCipher community build.
      source: sqlcipher

flutter:
  uses-material-design: true
